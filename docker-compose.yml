version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: virus_diagnostic_db
    environment:
      POSTGRES_USER: virusdb
      POSTGRES_PASSWORD: viruspass
      POSTGRES_DB: virus_diagnostic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virusdb -d virus_diagnostic"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - virus_network

volumes:
  postgres_data:

networks:
  virus_network:
    driver: bridge
